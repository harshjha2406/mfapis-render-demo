services:
  - type: web
    name: mfapis-harsh-demo
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m mfapis.bootstrap && python -m uvicorn mfapis.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      - key: AUTO_REFRESH_HISTORY
        value: "true"
      - key: FX_REFRESH_SECONDS
        value: "15"
      - key: FX_MAX_QUOTE_AGE_SECONDS
        value: "120"
      - key: FX_LIVE_DISPLAY_AUTHORIZED
        value: "false"
      # MFAPIS_INGEST_KEY must be configured privately on Render.
      # Change FX_LIVE_DISPLAY_AUTHORIZED only with documented public display rights.
      # No Twelve Data, Massive, or other currency-rate API key is used.
      - key: DATABASE_URL
        fromDatabase:
          name: mfapis-harsh-db
          property: connectionString

databases:
  - name: mfapis-harsh-db
    plan: free
    region: singapore
    databaseName: mfapis
    user: mfapis
    postgresMajorVersion: "16"
    ipAllowList: []
