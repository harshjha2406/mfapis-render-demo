services:
  - type: web
    name: mfapis-harsh-demo
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m mfapis.bootstrap && python -m uvicorn mfapis.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      - key: AUTO_REFRESH_HISTORY
        value: "true"
      - key: FX_CACHE_SECONDS
        value: "60"
      - key: FX_MAX_QUOTE_AGE_SECONDS
        value: "300"
      - key: FX_PROVIDER_REQUESTS_PER_MINUTE
        value: "8"
      - key: FX_PROVIDER_REQUESTS_PER_DAY
        value: "800"
      - key: DATABASE_URL
        fromDatabase:
          name: mfapis-harsh-db
          property: connectionString

databases:
  - name: mfapis-harsh-db
    plan: free
    region: singapore
    databaseName: mfapis
    user: mfapis
    postgresMajorVersion: "16"
    ipAllowList: []
